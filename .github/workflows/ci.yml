name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Release, Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check support table sync
        shell: pwsh
        run: ./scripts/Sync-SupportTable.ps1 -CheckOnly

      - name: Build
        run: dotnet build CdBurner.sln --configuration Release -warnaserror

      # The archive recovery tests run real par2 (the same release the app's optional download installs).
      - name: Install par2cmdline
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'par2'
          Invoke-WebRequest https://github.com/Parchive/par2cmdline/releases/download/v1.4.0/par2cmdline-1.4.0-win-x64.zip -OutFile "$dir.zip"
          Expand-Archive "$dir.zip" -DestinationPath $dir
          $exe = Get-ChildItem $dir -Recurse -Filter par2.exe | Select-Object -First 1
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $exe.FullName -V

      # Every test runs against the built-in virtual drive; no optical hardware is needed.
      - name: Test
        run: dotnet test CdBurner.sln --configuration Release --no-build --logger "trx" --results-directory TestResults

      - name: Verify Windows ARM64 build
        run: |
          dotnet publish src/CdBurner.Cli/CdBurner.Cli.csproj -c Release -r win-arm64 --self-contained false
          dotnet publish src/CdBurner.App/CdBurner.App.csproj -c Release -r win-arm64 --self-contained false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
