name: Bug report
description: Something doesn't work as described.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: IgnisDisc version
      placeholder: "1.10"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Audio CD workspace
        2. Add album.cue
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened instead
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error messages, screenshots or CLI output
      description: For drive-related problems, also paste `ignisdisc-cli drives --json` and `ignisdisc-cli media-info --drive D: --json`.
